[package]
name = "chaos-tproxy-openapi"
version = "0.5.3"
edition = "2024"
description = "Generated OpenAPI types for chaos-tproxy config. Do not edit by hand."

[dependencies]
serde = { version = "1", features = ["derive"] }

[build-dependencies]
anyhow = "1"
openapiv3 = "2"
prettyplease = "0.2"
progenitor = { version = "0.14", default-features = false }
serde_json = "1"
serde_yaml = "0.9"
syn = { version = "2", features = ["full"] }
