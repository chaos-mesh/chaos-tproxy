proxy_ports: [80, 443, 8080] # Omitted or null stops interception; an empty array attempts setup.
rules:
  - target: Request
    selector:
      port: 8080
      path: /example # Match this exact path.
      method: GET
    actions:
      delay: 10s
      replace:
        body:
          contents:
            type: TEXT
            value: '{"name": "Chaos Mesh", "message": "Hello!"}'
tls:
  cert_file:
    type: Path
    value: /usr/local/example.cert
  key_file:
    type: Path
    value: /usr/local/example.key
  # ca_file:
  #   type: Path
  #   value: /usr/local/root.cert
