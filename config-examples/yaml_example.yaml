proxy_ports: [80, 443, 8080] # Omitted or null stops interception; an empty array attempts setup.
rules:
  - target: Request
    selector:
      port: 8080
      path: /example # Match this exact path.
      method: GET
    actions:
      delay: 10s
      replace:
        body:
          contents:
            type: TEXT
            value: '{"name": "Chaos Mesh", "message": "Hello!"}'
        # contents:
        #   type: BASE64
        #   value: 'eyJuYW1lIjogIkNoYW9zIE1lc2giLCAibWVzc2FnZSI6ICJIZWxsbyEifQ=='
      patch:
        queries:
        - [foo, bar]
        - [foo, other]
        body:
          contents:
            type: JSON
            value: '{"message": "Hi!"}'

  - target: Response
    selector:
      port: 80
      path: /example
      method: GET
      code: 404
    actions:
      abort: true
